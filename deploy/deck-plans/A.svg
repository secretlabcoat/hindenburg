<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="A deck game schematic, bow up"><rect width="400" height="560" fill="#d6e6f5"/><text x="16" y="18" fill="#1c2430" font-family="Georgia, serif" font-size="14" font-weight="700">A deck</text><text x="16" y="532" fill="#1c2430" font-family="Georgia, serif" font-size="11">Game schematic · not a measured blueprint</text><text x="16" y="548" fill="#1c2430" font-family="Georgia, serif" font-size="11">Bow ↑   Port ←   Starboard →   door —   stairs = ladder   dashed = gated</text><g data-place="promenade"><rect x="100" y="24" width="200" height="78" rx="2" fill="#c48b93" stroke="#243044" stroke-width="4"/><text x="200" y="63" text-anchor="middle" fill="#1c2430" font-family="Georgia, serif" font-size="13">Promenade</text></g><g data-place="lounge"><rect x="100" y="118" width="200" height="100" rx="2" fill="#c48b93" stroke="#243044" stroke-width="4"/><text x="200" y="168" text-anchor="middle" fill="#1c2430" font-family="Georgia, serif" font-size="13">Passenger lounge</text></g><g data-place="acorridor"><rect x="140" y="250" width="120" height="180" rx="2" fill="#e7d2c4" stroke="#243044" stroke-width="4"/><text x="200" y="340" text-anchor="middle" fill="#1c2430" font-family="Georgia, serif" font-size="13">Passenger corridor</text></g><g data-place="acabin"><rect x="16" y="280" width="108" height="110" rx="2" fill="#c48b93" stroke="#243044" stroke-width="4"/><text x="70" y="335" text-anchor="middle" fill="#1c2430" font-family="Georgia, serif" font-size="13">Cabin (A deck)</text></g><g data-transfer="1"><rect x="276" y="300" width="108" height="64" fill="#f3d48a" stroke="#243044" stroke-width="3"/><text x="330" y="336" text-anchor="middle" fill="#1c2430" font-family="Georgia, serif" font-size="11">To B deck ↓</text></g><line data-link="lounge-promenade" x1="200.0" y1="118.0" x2="200.0" y2="102.0" stroke="#243044" stroke-width="3"/><line data-link="lounge-acorridor" x1="200.0" y1="218.0" x2="200.0" y2="250.0" stroke="#243044" stroke-width="3"/><line data-link="acorridor-acabin" x1="140.0" y1="337.7" x2="124.0" y2="337.1" stroke="#243044" stroke-width="3"/><line data-link="acorridor-bcorridor" x1="260.0" y1="336.3" x2="276.0" y2="335.3" stroke="#243044" stroke-width="5"/></svg>